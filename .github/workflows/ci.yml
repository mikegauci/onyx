name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make check-web
      - run: make test-web
      - run: make build

  api:
    name: API (ruff, mypy, pytest, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Same image as infrastructure/docker-compose.yml, on the port .env.example expects.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: onyx
          POSTGRES_PASSWORD: onyx_local_only
          POSTGRES_DB: onyx
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U onyx -d onyx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Database tests fail instead of skipping when Postgres is unreachable.
      ONYX_API_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: apps/api
          enable-cache: true
      - run: cd apps/api && uv sync --frozen
      - run: make check-api
      - name: Turn off Postgres durability (CI-only throwaway server)
        # Never do this on a real database: a crash could lose or corrupt data.
        env:
          PGPASSWORD: onyx_local_only
        run: |
          for setting in "fsync = off" "synchronous_commit = off" "full_page_writes = off"; do
            psql -h localhost -p 54322 -U onyx -d onyx -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET $setting"
          done
          psql -h localhost -p 54322 -U onyx -d onyx -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
          psql -h localhost -p 54322 -U onyx -d onyx -At -c "SHOW fsync" | grep -qx off
      - run: make test-api
      - name: Migrate and seed a database the way developers do
        # Seeding twice proves it is idempotent.
        run: make db-migrate && make db-seed && make db-seed

  api-image:
    name: API container (build + /health smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make api-image-smoke

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: onyx
          POSTGRES_PASSWORD: onyx_local_only
          POSTGRES_DB: onyx
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U onyx -d onyx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: apps/api
          enable-cache: true
      - run: cd apps/api && uv sync --frozen
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(cd apps/platform && pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium and its OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd apps/platform && pnpm exec playwright install --with-deps chromium
      - name: Install Chromium OS dependencies (browser restored from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd apps/platform && pnpm exec playwright install-deps chromium
      - name: Turn off Postgres durability (CI-only throwaway server)
        # Never do this on a real database: a crash could lose or corrupt data.
        env:
          PGPASSWORD: onyx_local_only
        run: |
          for setting in "fsync = off" "synchronous_commit = off" "full_page_writes = off"; do
            psql -h localhost -p 54322 -U onyx -d onyx -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET $setting"
          done
          psql -h localhost -p 54322 -U onyx -d onyx -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
          psql -h localhost -p 54322 -U onyx -d onyx -At -c "SHOW fsync" | grep -qx off
      - run: make e2e
        env:
          CI: "1"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/platform/playwright-report
            apps/platform/test-results
          retention-days: 7

  ci:
    name: ci
    if: always()
    needs: [web, api, api-image, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
