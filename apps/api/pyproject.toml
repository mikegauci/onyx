[project]
name = "onyx-api"
version = "0.1.0"
description = "Onyx Platform API (FastAPI)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.1",
    "email-validator==2.3.0",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pyjwt[crypto]==2.15.1",
    "reportlab==4.5.1",
    "sqlalchemy[asyncio]==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
# Tests build SQL from fixed table/role identifiers, never from input.
"tests/**" = ["S101", "S608"]
# Migrations build DDL from module-level constants, never from input.
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
# ReportLab ships no type information; its use is confined to app/modules/quotations/pdf.py.
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # Starlette suggests httpx2 for TestClient; revisit when pinning test deps in PR-002.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
