# Render Blueprint for the Onyx Platform API (PR-002).
# Only the preview service is defined here. The production service, `onyx-api` (free plan,
# Frankfurt, Docker from main, https://api.onyx.mt), was created in the Render dashboard on
# 2026-11-23 and is not managed by this blueprint, so a blueprint sync cannot duplicate or
# change it. Its settings are recorded in docs/deployment/production.md.
services:
  - type: web
    name: onyx-api-preview
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
    envVars:
      - key: ONYX_API_ENVIRONMENT
        value: preview
      - key: ONYX_API_LOG_LEVEL
        value: INFO
      # Explicit https origins of the preview platform app (comma-separated, no wildcards).
      - key: ONYX_API_CORS_ORIGINS
        sync: false
      # AI gateway. Unset = AI unavailable (fail closed). Keys are entered in the dashboard.
      - key: ONYX_API_OPENAI_API_KEY
        sync: false
      - key: ONYX_API_ANTHROPIC_API_KEY
        sync: false
      - key: ONYX_API_AI_DEFAULT_MODEL
        sync: false
      - key: ONYX_API_AI_MODEL_PRICES
        sync: false
      # Email connector (Resend). Unset = email channels not connected (fail closed).
      - key: ONYX_API_RESEND_API_KEY
        sync: false
      - key: ONYX_API_RESEND_WEBHOOK_SECRET
        sync: false
      - key: ONYX_API_EMAIL_INBOUND_DOMAIN
        sync: false
      - key: ONYX_API_EMAIL_FROM_DOMAIN
        sync: false
      # WhatsApp connector (Meta). Unset = WhatsApp channels not connected (fail closed).
      # Stripe Billing (PR-026): test-mode keys first; the owner creates the account and prices.
      - key: ONYX_API_STRIPE_API_KEY
        sync: false
      - key: ONYX_API_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ONYX_API_STRIPE_PRICE_STARTER
        sync: false
      - key: ONYX_API_STRIPE_PRICE_GROWTH
        sync: false
      # Error tracking (PR-027): off until the owner creates the Sentry project.
      - key: ONYX_API_SENTRY_DSN
        sync: false
      - key: ONYX_API_WHATSAPP_APP_SECRET
        sync: false
      - key: ONYX_API_WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: ONYX_API_WHATSAPP_ACCESS_TOKEN
        sync: false
      # Deal documents (VA-007): Supabase Storage, private bucket "tenant-files". Unset = uploads
      # return 503 (fail closed).
      - key: ONYX_API_SUPABASE_SERVICE_KEY
        sync: false
      # Scheduler (VA-007): same value as the GitHub secret ONYX_SCHEDULER_SECRET.
      - key: ONYX_API_SCHEDULER_SECRET
        sync: false
      # Missed-call text-back (VA-004): off until the owner buys the cloud number.
      - key: ONYX_API_TELEPHONY_WEBHOOK_URL
        sync: false
      - key: ONYX_API_TWILIO_ACCOUNT_SID
        sync: false
      - key: ONYX_API_TWILIO_AUTH_TOKEN
        sync: false
